<span id="section-9" class="rh-source-anchor" data-pdf-destination="section.9"></span><h2 class="rh-prose" id="p-0680-b-04" data-source-page="680"><strong>9</strong> <strong>The covolume estimate and its uniformity</strong></h2>
<p class="rh-prose" id="p-0680-b-05" data-source-page="680">This section reconstructs the numerical and lattice argument used in F-12. Its geometric inputs are kept explicit. In particular, proving a numerical implication from eight estimates does not prove that the required geometric data satisfy those estimates.</p>
