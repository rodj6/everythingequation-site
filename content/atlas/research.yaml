  # ─────────────────────────── Field · spectral carriers ───────────────────────────

  - id: cscf-operator-origin
    tier: field
    group: spectral
    paper: cscf
    label: "CSCF: one carrier, two linked responses"
    shortLabel: CSCF operator origin
    eyebrow: Spectral carriers · 3 November 2026
    status: theorem
    statusNote: >-
      Operator results proved with standard form representation, functional calculus and modular
      theory. They apply once a realization supplies a Hilbert carrier, a closed curvature form and a
      declared coherence symbol.
    summary: A positive selfadjoint carrier generates coherent evolution and dissipative relaxation through its functional calculus.
    description: >-
      A closed nonnegative curvature form determines the carrier K. A declared coherence symbol
      selects C = h(K), while the contraction semigroup and its averaged transmission give the
      dissipative face. Every response keeps the spectral decomposition of K; attenuation and phase
      rotation differ in how they weight it. The paper places this structure between the aperture
      output and the physical readout, and unifies the earlier Lambda and coherence constructions.
    note: >-
      The common-carrier statement concerns the two faces within each realization. Different systems
      have different carriers; identifying a shared physical source law would need the corresponding
      realization maps between systems.
    equations:
      - tag: "CSCF (1)"
        title: The two responses of one carrier
        tex: 'S_t=e^{-tK},\qquad C=h(K),\qquad U_s=e^{-isC}'
        interpretation: >-
          Contraction and phase rotation generated by the same positive selfadjoint operator. This is
          the content of calling them two faces of one field.
    read:
      - { label: "Complete web edition", href: "/source-readout/cscf" }
      - { label: "One carrier, two responses", href: "/source-readout/cscf/01-common-carrier" }
      - { label: "Spectral carriers reading series", href: "/source-readout/spectral-carriers" }
    relations:
      - { to: canonical-field, label: complete operator argument for, type: mathematical, note: "The paper begins where an admitted spectral branch supplies the carrier." }
      - { to: cscf-modular-ratios, label: contains, type: mathematical, note: "Theorem 9.1 of the paper." }
      - { to: cscf-closure-coherence, label: contains, type: mathematical, note: "Section 11 of the paper." }
      - { to: adaptive-carriers, label: continued by, type: conceptual, note: "The fixed-carrier theory is extended to a carrier that changes with the state." }
    added: "2026-11-10"

  - id: cscf-modular-ratios
    tier: field
    group: spectral
    paper: cscf
    label: The modular carrier of spectral ratios
    shortLabel: Modular ratio signature
    eyebrow: Spectral carriers · result
    status: theorem
    statusNote: >-
      Theorem 9.1 of the CSCF paper, for a finite retained spectral subspace with all multiplicities
      kept. It locates the measured statistic exactly; it does not explain why a profile takes one
      form and not another.
    summary: The ordered ratios of a positive finite readout are the spectrum of its modular operator.
    description: >-
      For a positive finite readout V = g(K), the modular operator of the normalized state has
      eigenvalues v_i / v_j, and its logarithm is the commutator with log V. The measured ratio
      statistic is therefore a spectral-window measure of an operator built from the retained
      readout, with multiplicities and the removal of self-pairs kept exactly as in the original
      measurements.
    equations:
      - tag: "CSCF (3)"
        title: Ratio and log-ratio carriers
        tex: '\Delta_\rho(e_i e_j^*)=\frac{v_i}{v_j}\,e_i e_j^*,\qquad \log\Delta_\rho=\mathcal D,\quad \mathcal D(X)=AX-XA,\ A=\log V'
        interpretation: >-
          Each ordered pair of retained spectral values is an eigenvalue direction of the modular
          operator; the log-ratio is generated by a commutator.
    read:
      - { label: "The modular carrier of spectral ratios", href: "/source-readout/cscf/08-modular-ratios" }
    relations:
      - { to: field-fingerprint, label: operator form of, type: mathematical, note: "Gives the pooled ratio statistic its exact operator location." }
      - { to: spectral-ratios, label: locates the measurements of, type: conceptual, note: "The measurements are empirical input; the theorem is about their representation." }
    added: "2026-11-10"

  - id: cscf-closure-coherence
    tier: field
    group: spectral
    paper: cscf
    label: From closure deficit to coherent leakage
    shortLabel: Closure-to-coherence bound
    eyebrow: Spectral carriers · result
    status: theorem
    statusNote: >-
      Proved in the CSCF paper for a finite positive carrier, under finite bandwidth and regularity of
