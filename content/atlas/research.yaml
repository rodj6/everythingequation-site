    summary: The failure of a projected dissipative evolution to close bounds the leakage under a nominated coherent face.
    description: >-
      Projection can lose information even when the source is exactly known. In a finite positive
      carrier the dissipative closure defect measures that loss, and regularity of the coherence
      symbol turns it into a bound on coherent leakage. The result transfers a quantitative
      observable constraint between the two faces of the field.
    read:
      - { label: "What closes after projection", href: "/source-readout/cscf/10-quotient-closure" }
    relations:
      - { to: foundation-projected-dynamics, label: uses, type: mathematical, note: "The closure criterion is Paper 5's kernel-invariance theorem." }
      - { to: coherent-face, label: constrains, type: conceptual, note: "A bound on leakage under the nominated coherent face." }
    added: "2026-11-10"

