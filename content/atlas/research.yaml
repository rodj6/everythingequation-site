# ATLAS · RESEARCH ENTRIES
#
# Entries of the Reality Atlas that come from published papers and articles on
# this site. Each entry is one place a visitor can open in the Atlas.
#
# This file is content, not code. To add a paper to the Atlas, add an entry
# here and run `npm run dev` or `npm run build`; the Atlas, its search, its
# counts, llms.txt and graph.json update themselves. Nothing in the graphics
# code needs to change. See ATLAS-UPDATING.md for a worked example.
#
# Fields
#   id            unique, lower-case, never reused or renamed (it is the ?focus= address)
#   tier          frame | foundation | source | tier0 | aperture | field | tier1 | observable | recovery
#   group         which list the entry appears in (see `groups` in src/data/atlas/schema.ts)
#   label         title shown in the Atlas
#   shortLabel    optional shorter title for tight spaces
#   eyebrow       small line above the title
#   paper         optional slug in content/papers.yaml; title, DOI, date and text are read from there
#   status        theorem | conditional | construction | measured | interpretation | open | historical
#   statusNote    one sentence: what that status rests on, in plain words. Never stronger than the source.
#   summary       one sentence. Defaults to the paper's `role`.
#   description   a short paragraph. Defaults to the paper's `summary`.
#   note          optional extra remark shown under the description
#   read          reading links; the first is the main one. Defaults to the paper's web edition.
#   relations     links to other Atlas entries: { to, label, type: mathematical | conceptual, note }
#                 Use `mathematical` only where the source proves a dependence between the two.
#   equations     optional: { tag, title, tex, interpretation }
#   added         date the entry was added to the Atlas
#
# Wording rule: describe what the source establishes and under which
# assumptions. Do not add findings, and do not present a proposal as a result.

version: 1
entries:

  # ───────────────────────────── The whole model ─────────────────────────────

  - id: frame-ground
    tier: frame
    group: frame
    label: Unconditioned ground
    eyebrow: The whole model · 1 of 4
    status: interpretation
    statusNote: >-
      Part of the framework's ontological architecture. It is left unspecified on purpose and has no
      symbol in the equations.
    summary: What the theory takes as fundamental, left unspecified because every specification already divides it.
    description: >-
      At this level none of the distinctions used to describe a state, an object, an observer or a
      possible event has been supplied. The article calls it unlimited potential in that sense: no
      differentiation has been imposed. "Prior" means explanatory dependence; no clock is assumed on
      which the ground comes first. The instrument in this Atlas does not draw the ground. It begins
      one step later, at Ω, which already has mathematical structure: a signature, elementary cells,
      witnesses and formation operations.
    note: >-
      Ω is a model of source structure built inside the formal account. The ground is what that
      account leaves unspecified, and it has no symbol in the equations. A quantum vacuum, a
      probability distribution and a Hilbert space already carry structure, so none of them is the
      ground either.
    read:
      - { label: "The Full Shadow Model · the ground before distinction", href: "/articles/full-shadow-model#the-ground-before-distinction" }
      - { label: "Framework · vocabulary", href: "/framework" }
    relations:
      - { to: frame-unsplit, label: explanatory dependence, type: conceptual, note: "An order of explanation." }
      - { to: omega, label: where the formal account begins, type: conceptual, note: "Ω is a defined formation package. It is a model within the account, and the ground stays unspecified." }
    added: "2026-11-10"

  - id: frame-unsplit
    tier: frame
    group: frame
    label: The unsplit
    eyebrow: The whole model · 2 of 4
    status: interpretation
    statusNote: >-
      Part of the framework's ontological architecture. The consciousness monograph denotes it U; it
      is not inserted into the equations as a computable state.
    summary: Unity before the source–readout distinction.
    description: >-
      The point at which the framework speaks of one undivided reality, before separating structure
      from manifestation, subject from object, or an observer from what is observed. At this level
      there is no reflective self-awareness: no separate "I", no localized viewpoint, no personal
      memory. The working models begin once enough distinctions exist to specify their domains, maps
      and operations.
    read:
      - { label: "The Full Shadow Model · the unsplit", href: "/articles/full-shadow-model#the-unsplit-unity-before-source-and-readout" }
      - { label: "Dated A0 clarification", href: "/consciousness#a0-clarification" }
    relations:
      - { to: frame-complement, label: explanatory dependence, type: conceptual, note: "An order of explanation." }
    added: "2026-11-10"

  - id: frame-complement
    tier: frame
    group: frame
    label: Source and readout
    eyebrow: The whole model · 3 of 4
    status: interpretation
    statusNote: >-
      The ontological relationship is an account, not a theorem. The exact statements about a
      specified source, readout and target are proved in the seven foundation papers.
    summary: Two complementary aspects of one whole. We, our instruments and our records are within the readout.
    description: >-
      The source names the structure that supports realization. The readout names the form in which
      selected distinctions become physically expressed, available or recorded. An observer does not
      stand outside this relation: a physicist, a detector, a brain and a notebook are embedded in the
      readout. The formal theory studies the relation through nominated operational descriptions, a
      working source S and a readout T, with the same readout able to correspond to different source
      states.
    note: >-
      Reciprocity means mutual involvement within the whole. It does not mean that either side
      contains an invertible copy of the other's complete state.
    equations:
      - tag: "schematic"
        title: Working source and readout
        tex: 'p:S\longrightarrow T'
        interpretation: >-
          S is a mathematical model of the relevant source structure, complete relative to a specified
          problem. The ground and the unsplit come before any such model.
      - tag: "descent criterion"
        title: When a question can be answered from the readout
        tex: 'p(s)=p(s^{\prime})\ \Longrightarrow\ f(s)=f(s^{\prime}),\qquad f=\bar f\circ p'
        interpretation: >-
          A target f has a readout-level answer exactly when it takes one value on every set of source
          states that share a readout.
    read:
      - { label: "The Full Shadow Model · two complementary aspects", href: "/articles/full-shadow-model#two-complementary-aspects-of-one-whole" }
      - { label: "Source–Readout Theory", href: "/source-readout" }
    relations:
      - { to: frame-differentiation, label: explanatory dependence, type: conceptual, note: "An order of explanation." }
      - { to: foundation-non-equivalence, label: studied exactly in, type: conceptual, note: "The papers fix a source, a readout and a target, then prove what follows." }
    added: "2026-11-10"

  - id: frame-differentiation
    tier: frame
    group: frame
    label: Recursive differentiation
    eyebrow: The whole model · 4 of 4
    status: interpretation
    statusNote: >-
      Names an architectural relationship. Each physical branch must supply the laws that make its
      own process work; recursion alone does not select them.
    summary: Distinctions take part in further interactions, supporting structures, retained records and localized perspectives.
    description: >-
      An existing organization conditions what can happen next; new records can be retained and
      reused; recurring interactions can support persistent structures. The physical content lies in
      specifying these relationships: how projected dynamics acquire memory, how apparatuses write and
      retain records, how geometric configurations realize invariant relations, and how local
      organizations support recurrent access.
    note: >-
      The instrument drawn in this Atlas follows one declared realization programme. It begins at Ω,
      a defined pre-geometric formation package with mathematical structure. The ground comes before
      it and stays unspecified.
    read:
      - { label: "The Full Shadow Model · recursive differentiation", href: "/articles/full-shadow-model#recursive-differentiation-into-a-physical-world" }
    relations:
      - { to: omega, label: one declared realization programme, type: conceptual, note: "Ω belongs to the formal realization account. The ground comes before it and is left unspecified." }
      - { to: spc2-constitution, label: localized perspectives, type: conceptual, note: "The consciousness branch states its own constitutive premises." }
    added: "2026-11-10"

