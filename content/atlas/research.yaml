  - id: everything-equation-schema
    tier: foundation
    group: foundation
    label: The Everything Equation, then and now
    shortLabel: Everything Equation
    eyebrow: Where the programme began
    status: interpretation
    statusNote: >-
      An organizing schema. The results are proved in the papers that develop it, each with its own
      definitions and hypotheses. The 2025–26 lawhood papers, which state it as a theorem about law
      candidates, are preserved as records of that formulation.
    summary: The fixed-point idea the site is named after, and the three exact constructions that carry it today.
    description: >-
      The Everything Equation asked what makes a description a law, and answered with a fixed point:
      a law is what comes back unchanged after its presentation is collapsed (∂), its admissible
      content is kept (Δ) and the result is completed (Ω). Shadow Theory keeps the idea and gives it
      three exact forms, each with its own objects. Source closure: the lawful source structures of
      Tier 0 are the least fixed point of the source-law operator. Canonical completion: complete a
      readout for a nominated family of relations, complete it again, and nothing further is added.
      Dynamical closure: observable evolution closes on a readout exactly when equal readouts have
      equal futures.
    note: >-
      Ω has had three jobs, and it helps to keep them apart. In the lawhood papers it is the
      completion operator of the equation. In the typed schema it carries a subscript, Ω_T1, for the
      Tier-1 completion and readout role. In the source-to-readout construction it names the source
      formation package, and closure is one of the operations that package contains. The
      unconditioned ground has no symbol in any of the three.
    equations:
      - tag: "original form"
        title: The Everything Equation
        tex: 'L \;=\; \Omega\,\Delta\,\partial[\,L\,]'
        interpretation: >-
          Lawhood as a fixed point of presentation collapse, admissibility and completion. The
          starting point of the programme.
      - tag: "typed form"
        title: Typed form
        tex: 'L \;=\; \Omega_{T1}\,\Delta\,\partial[\,L\,]'
        interpretation: >-
          The subscript marks the Tier-1 completion and readout role, so the operator is not read as
          the source formation package.
      - tag: "4.10"
        title: How the canonical construction reads it
        tex: '\text{lawhood}=\text{source closure}\circ\text{generated distinction}\circ\text{intrinsic boundary}'
        interpretation: >-
          In the source-to-readout construction ∂ extracts the intrinsic boundary of a source cell, Δ
          forms the attachments those boundaries allow, and closure admits what results.
      - tag: "4.9"
        title: Source closure as an exact fixed point
        tex: '\operatorname{Ob}\mathsf S_{\rm adm}=\operatorname{Cl}_\Omega(\operatorname{Ob}\mathsf S_{\rm adm})=\mu\operatorname{Cl}_\Omega'
        interpretation: >-
          The typed statement behind the schema. Cl is applied repeatedly until nothing new appears;
          Tier 0 is where that iteration stops.
    read:
      - { label: "From the Everything Equation to Source–Readout Theory", href: "/source-readout/origins" }
      - { label: "Framework · the role of the Everything Equation", href: "/framework#everything-equation" }
      - { label: "The preserved Everything Equation page", href: "/legacy/what-is-the-everything-equation" }
    relations:
      - { to: tier0-law, label: typed as source closure in, type: mathematical, note: "Equations 4.5 to 4.10 of the canonical foundation give the schema its type at Tier 0." }
      - { to: foundation-minimal-completion, label: continued by, type: conceptual, note: "Canonical completion is idempotent up to canonical isomorphism: the fixed-point idea for a fixed source, readout and relation family." }
      - { to: foundation-projected-dynamics, label: continued by, type: conceptual, note: "Closure of observable dynamics is a separate question with its own exact criterion." }
      - { to: foundation-non-equivalence, label: developed into, type: conceptual, note: "The schema organizes the development; the results are proved separately." }
    added: "2026-11-10"

