name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SKIP_ZENODO: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install reviewed lockfile
        run: npm ci
      - name: Verify cache-only proposal boundary
        run: node scripts/verify-zenodo-proposal.mjs
      - name: Verify external metadata rendering boundary
        run: npm run verify:metadata
      - name: Build complete website
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
