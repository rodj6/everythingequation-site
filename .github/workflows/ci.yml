name: Website CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Retain the legacy check name for existing protected-branch requirements.
    name: ${{ matrix.output == 'legacy-next' && 'Build and typecheck' || 'Build and typecheck (Vercel adapter)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        output: [legacy-next, vercel-adapter]
    env:
      SKIP_ZENODO: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install reviewed lockfile
        run: npm ci
      - name: Verify cache-only proposal boundary
        run: node scripts/verify-zenodo-proposal.mjs
      - name: Verify external metadata rendering boundary
        run: npm run verify:metadata
      - name: Test security-header discovery and fail-closed validation
        run: npm run test:security-headers
      - name: Install the production builder's adapter in an isolated directory
        if: matrix.output == 'vercel-adapter'
        shell: bash
        run: |
          adapter_dir="$RUNNER_TEMP/everythingequation-vercel-adapter"
          mkdir -p "$adapter_dir"
          # Vercel CLI 64.7.0 uses @vercel/next 24.0.0; keep its exact peer aligned.
          # Review both pins when the production builder changes.
          npm install --prefix "$adapter_dir" --ignore-scripts --no-save --package-lock=false --no-audit --no-fund @vercel/next@24.0.0 @vercel/build-utils@14.22.0
          echo "NEXT_ADAPTER_PATH=$adapter_dir/node_modules/@vercel/next/dist/adapter/index.js" >> "$GITHUB_ENV"
      - name: Build complete website
        run: npm run build
      - name: Verify generated security headers without modifying output
        run: npm run verify:security
      - name: Type check
        run: npx tsc --noEmit
