<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Temporal roles in the three-note construction</title><desc id="desc">Source notes C, E, G at 0, 100, 200 milliseconds are received ten milliseconds later. The C before E transition is used at 115 milliseconds, before G reception at 210 milliseconds.</desc><rect width="900" height="360" rx="12" fill="#0b1220"/><g font-family="system-ui,sans-serif" font-size="15" fill="#dbeafe"><text x="450" y="28" text-anchor="middle" font-size="19">Source order and current availability occupy different relations</text><text x="155" y="85" text-anchor="end">Source occurrence</text><line x1="170" y1="80" x2="840" y2="80" stroke="#334155"/><text x="155" y="165" text-anchor="end">Local reception</text><line x1="170" y1="160" x2="840" y2="160" stroke="#334155"/><text x="155" y="265" text-anchor="end">Consolidation / use</text><line x1="170" y1="260" x2="840" y2="260" stroke="#334155"/><circle cx="170.0" cy="80" r="5" fill="#22d3ee"/><text x="170.0" y="65" text-anchor="middle">C</text><line x1="170.0" y1="85" x2="196.0" y2="155" stroke="#94a3b8"/><circle cx="196.0" cy="160" r="5" fill="#22d3ee"/><circle cx="430.0" cy="80" r="5" fill="#22d3ee"/><text x="430.0" y="65" text-anchor="middle">E</text><line x1="430.0" y1="85" x2="456.0" y2="155" stroke="#94a3b8"/><circle cx="456.0" cy="160" r="5" fill="#22d3ee"/><circle cx="690.0" cy="80" r="5" fill="#22d3ee"/><text x="690.0" y="65" text-anchor="middle">G</text><line x1="690.0" y1="85" x2="716.0" y2="155" stroke="#94a3b8"/><circle cx="716.0" cy="160" r="5" fill="#22d3ee"/><line x1="196.0" y1="160" x2="469.0" y2="260" stroke="#a78bfa" stroke-width="2"/><line x1="456.0" y1="160" x2="469.0" y2="260" stroke="#a78bfa" stroke-width="2"/><line x1="469.0" y1="260" x2="729.0" y2="260" stroke="#a78bfa" stroke-width="2"/><line x1="716.0" y1="160" x2="729.0" y2="260" stroke="#a78bfa" stroke-width="2"/><circle cx="469.0" cy="260" r="6" fill="#a78bfa"/><text x="469.0" y="289" text-anchor="middle" font-size="13">C before E; E live / C retained</text><circle cx="729.0" cy="260" r="6" fill="#a78bfa"/><text x="729.0" y="289" text-anchor="middle" font-size="13">C-E-G phrase; G live</text><text x="170.0" y="325" text-anchor="middle">0</text><text x="300.0" y="325" text-anchor="middle">50</text><text x="430.0" y="325" text-anchor="middle">100</text><text x="560.0" y="325" text-anchor="middle">150</text><text x="690.0" y="325" text-anchor="middle">200</text><text x="820.0" y="325" text-anchor="middle">250</text><text x="505" y="350" text-anchor="middle">Illustrative local time (milliseconds)</text></g></svg>