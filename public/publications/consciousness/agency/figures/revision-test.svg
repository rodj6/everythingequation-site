<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title description">
  <title id="title">The functional organization of evaluative rule revision</title>
  <desc id="description">Retained commitments z are read by an assessor, which selects a candidate charter and installs it. The installed charter governs rule execution on fresh considerations e. Execution produces the tested internal or external disposition. These are functional roles, not the physical component graph for SPC-2 qualification.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#215a69"/></marker>
  </defs>
  <rect width="1120" height="410" rx="16" fill="#f5f8f9"/>
  <g fill="#fff" stroke="#567884" stroke-width="2">
    <rect x="35" y="45" width="305" height="100" rx="9"/>
    <rect x="408" y="45" width="305" height="100" rx="9"/>
    <rect x="780" y="45" width="305" height="100" rx="9"/>
    <rect x="35" y="270" width="305" height="100" rx="9"/>
    <rect x="408" y="270" width="305" height="100" rx="9"/>
    <rect x="780" y="270" width="305" height="100" rx="9"/>
  </g>
  <g stroke="#215a69" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M342 95 H401"/>
    <path d="M715 95 H773"/>
    <path d="M930 148 L674 262"/>
    <path d="M342 320 H401"/>
    <path d="M715 320 H773"/>
  </g>
  <g fill="#173643" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="23">
    <text x="187" y="85">Retained commitments</text>
    <text x="187" y="120" font-style="italic">z</text>
    <text x="560" y="85">Assessment</text>
    <text x="560" y="120">candidate charter</text>
    <text x="932" y="85">Installed rule</text>
    <text x="932" y="120" font-style="italic">χ</text>
    <text x="187" y="310">Fresh considerations</text>
    <text x="187" y="345" font-style="italic">e</text>
    <text x="560" y="310">Rule execution</text>
    <text x="560" y="345" font-style="italic">fχ(e)</text>
    <text x="932" y="310">Tested disposition</text>
    <text x="932" y="345">internal or external</text>
  </g>
  <g fill="#486673" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" font-size="18">
    <text x="371" y="28">read route</text>
    <text x="746" y="28">installation</text>
  </g>
</svg>
